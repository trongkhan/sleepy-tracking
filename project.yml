name: Sleepy
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
targets:
  SleepTracker:
    type: application
    platform: iOS
    sources: [SleepTracker]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.sleepy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sleepy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dùng micro để phát hiện tiếng ngáy, ho, nói mớ trong lúc bạn ngủ. Âm thanh được xử lý ngay trên máy."
        INFOPLIST_KEY_NSMotionUsageDescription: "Dùng cảm biến chuyển động để ước lượng giai đoạn giấc ngủ."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Đọc dữ liệu giấc ngủ, nhịp tim từ Apple Health để kết quả chính xác hơn."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Lưu dữ liệu giấc ngủ vào Apple Health."
        INFOPLIST_KEY_UIBackgroundModes: audio
    entitlements:
      path: SleepTracker/SleepTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
